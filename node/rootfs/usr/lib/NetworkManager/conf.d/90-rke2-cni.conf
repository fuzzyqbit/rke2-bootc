# NetworkManager leaves the CNI interfaces alone. This is a device section on
# purpose: the rke2-ansible role writes the keyfile plugin's list of ignored
# devices under /etc, and that key would override the same key set here.
[device-rke2-cni]
match-device=interface-name:cali*;interface-name:flannel*;interface-name:vxlan.calico;interface-name:vxlan-v6.calico;interface-name:tunl*;interface-name:cilium*;interface-name:lxc*
managed=0
