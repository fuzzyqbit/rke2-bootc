ansible_user: ansible

# Must equal the RKE2 version baked into the node image (RKE2_VERSION in versions.env).
rke2_install_version: v1.34.3+rke2r1

# Package repositories used by the rke2-ansible role (defaults shown).
rke2_common_yum_repo:
  name: rancher-rke2-common
  description: "Rancher RKE2 Common"
  baseurl: "https://rpm.rancher.io/rke2/stable/common/centos/9/noarch"
  gpgcheck: true
  gpgkey: "https://rpm.rancher.io/public.key"
rke2_versioned_yum_repo:
  name: rancher-rke2-1.34
  description: "Rancher RKE2 1.34"
  baseurl: "https://rpm.rancher.io/rke2/stable/1.34/centos/9/x86_64"
  gpgcheck: true
  gpgkey: "https://rpm.rancher.io/public.key"
