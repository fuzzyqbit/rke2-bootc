# Updates one node. Expects is_server, target_image and the play variables of rolling-update.yml.
- name: Read bootc status
  ansible.builtin.command: bootc status --format=json
  register: bootc_status
  changed_when: false

- name: Choose kubectl host
  ansible.builtin.set_fact:
    kube_host: "{{ (groups['rke2_servers'] | difference([inventory_hostname]) + [inventory_hostname]) | first }}"

- name: Read update marker
  ansible.builtin.command: >-
    {{ _kubectl }} get node {{ _node }}
    -o jsonpath='{.metadata.annotations.{{ update_marker | replace('.', '\.') }}}'
  delegate_to: "{{ kube_host }}"
  register: node_marker
  changed_when: false

- name: Write registry credentials
  ansible.builtin.copy:
    content: "{{ registry_auth_json }}"
    dest: /etc/ostree/auth.json
    owner: root
    group: root
    mode: "0600"
  when: registry_auth_json is defined
  no_log: true

- name: Stage target image
  ansible.builtin.command: "bootc switch {{ target_image }}"
  changed_when: true
  when: needs_update | bool

- name: Mark and cordon node
  when: needs_update | bool
  delegate_to: "{{ kube_host }}"
  block:
    - name: Read whether node is already cordoned
      ansible.builtin.command: "{{ _kubectl }} get node {{ _node }} -o jsonpath={.spec.unschedulable}"
      register: node_unschedulable
      changed_when: false

    # Only a fresh run decides this; a rerun after an interruption would see our own cordon.
    - name: Remember an operator cordon
      ansible.builtin.command: "{{ _kubectl }} annotate node {{ _node }} {{ was_cordoned_annotation }}=true --overwrite"
      changed_when: true
      when:
        - node_marker.stdout | trim | length == 0
        - node_unschedulable.stdout | trim == 'true'

    - name: Forget a stale operator cordon
      ansible.builtin.command: "{{ _kubectl }} annotate node {{ _node }} {{ was_cordoned_annotation }}-"
      changed_when: true
      when:
        - node_marker.stdout | trim | length == 0
        - node_unschedulable.stdout | trim != 'true'

    - name: Record boot ID before reboot
      ansible.builtin.command: "{{ _kubectl }} get node {{ _node }} -o jsonpath={.status.nodeInfo.bootID}"
      register: node_boot_before
      changed_when: false

    - name: Annotate and cordon
      ansible.builtin.command: "{{ item }}"
      loop:
        - "{{ _kubectl }} annotate node {{ _node }} {{ update_marker }}={{ target_image }} --overwrite"
        - "{{ _kubectl }} cordon {{ _node }}"
      changed_when: true

- name: Drain node
  ansible.builtin.command: >-
    {{ _kubectl }} drain {{ _node }} --ignore-daemonsets --delete-emptydir-data --timeout={{ _drain_timeout }}s
  delegate_to: "{{ kube_host }}"
  changed_when: true
  when: needs_update | bool

- name: Reboot into new image
  ansible.builtin.reboot:
    reboot_timeout: 900
  when: needs_update | bool

# Polls one cheap query: "<bootID> <Ready status>". A node rebooted in this run must report a new
# boot ID, otherwise the Ready=True from before the reboot could satisfy the check. Connection
# errors while the API comes back count as "not yet". Total time is about ready_timeout.
- name: Wait for node Ready
  ansible.builtin.command: >-
    {{ _kubectl }} get node {{ _node }}
    -o jsonpath='{.status.nodeInfo.bootID}{" "}{.status.conditions[?(@.type=="Ready")].status}'
  delegate_to: "{{ kube_host }}"
  register: node_ready
  until:
    - node_ready.rc == 0
    - (node_ready.stdout | default('')).split() | length == 2
    - (node_ready.stdout | default('')).split()[1] == 'True'
    - (not (needs_update | bool)) or (node_ready.stdout | default('')).split()[0] != (node_boot_before.stdout | default('') | trim)
  retries: "{{ [((_ready_timeout | int) / 10) | round(0, 'ceil') | int, 1] | max }}"
  delay: 10
  changed_when: false
  when: needs_update | bool or (node_marker.stdout | trim | length > 0)

- name: Wait for API server and etcd
  ansible.builtin.command: "{{ _kubectl }} get --raw /readyz"
  register: api_ready
  until: api_ready.rc == 0
  retries: 30
  delay: 10
  changed_when: false
  when: is_server | bool and (needs_update | bool or (node_marker.stdout | trim | length > 0))

- name: Verify booted image
  ansible.builtin.command: bootc status --format=json
  register: bootc_after
  changed_when: false
  failed_when: (bootc_after.stdout | from_json).status.booted.image.image.image != target_image
  when: needs_update | bool or (node_marker.stdout | trim | length > 0)

- name: Uncordon and clear marker
  when: needs_update | bool or (node_marker.stdout | trim | length > 0)
  delegate_to: "{{ kube_host }}"
  block:
    - name: Read operator cordon annotation
      ansible.builtin.command: >-
        {{ _kubectl }} get node {{ _node }}
        -o jsonpath='{.metadata.annotations.{{ was_cordoned_annotation | replace('.', '\.') }}}'
      register: node_was_cordoned
      changed_when: false

    - name: Uncordon unless the operator had cordoned the node
      ansible.builtin.command: "{{ _kubectl }} uncordon {{ _node }}"
      changed_when: true
      when: node_was_cordoned.stdout | trim != 'true'

    - name: Remove annotations
      ansible.builtin.command: "{{ _kubectl }} annotate node {{ _node }} {{ item }}-"
      loop:
        - "{{ update_marker }}"
        - "{{ was_cordoned_annotation }}"
      changed_when: true
